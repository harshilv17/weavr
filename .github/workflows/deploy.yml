name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Test Server
        working-directory: app/server
        run: npm test

      - name: Build Server
        working-directory: app/server
        run: npm run build

      - name: Build Web
        working-directory: app/web
        run: npm run build
